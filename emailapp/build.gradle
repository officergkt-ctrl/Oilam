plugins { id 'com.android.application' }

android {
    namespace 'com.oilam.gmail'
    compileSdk 36
    defaultConfig {
        applicationId 'com.oilam.gmail'
        minSdk 23
        targetSdk 28
        versionCode 3
        versionName '3.0'
    }
    packaging {
        resources {
            excludes += ['META-INF/LICENSE.md', 'META-INF/NOTICE.md', 'META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }
}

dependencies {
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
}
